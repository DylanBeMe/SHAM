name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-fund --no-audit
          else
            echo "::warning::package-lock.json is missing; using npm install. Run the Prepare lockfile workflow and commit it before a stable tag."
            npm install --no-fund --no-audit
          fi

      - name: Release-readiness checks
        run: npm run release:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build local image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: sham:ci
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
          build-args: |
            VERSION=1.0.0
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Start container
        run: |
          docker run -d --name sham-ci -p 127.0.0.1:18080:8080 \
            -e SHAM_JWT_SECRET=ci-only-secret-with-at-least-32-characters \
            sham:ci

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs sham-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs sham-ci || true
