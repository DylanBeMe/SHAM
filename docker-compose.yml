services:
  sham:
    image: ${SHAM_IMAGE:-sham:1.0.0}
    build:
      context: .
      args:
        VERSION: 1.0.0
    container_name: sham
    restart: unless-stopped
    environment:
      SHAM_HOST: 0.0.0.0
      SHAM_PORT: 8080
      SHAM_DATA_PATH: /data
      SHAM_UPLOAD_LIMIT_MB: 250
      SHAM_EDITOR_LIMIT_MB: 4
      SHAM_EDGE_HOST: 0.0.0.0
      SHAM_EDGE_HTTP_PORT: 80
      SHAM_EDGE_HTTPS_PORT: 443
      NODE_ENV: production
      # SHAM_JWT_SECRET: replace-with-at-least-32-random-characters
    volumes:
      - ./sham-data:/data
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
      - "4100-4199:4100-4199"
